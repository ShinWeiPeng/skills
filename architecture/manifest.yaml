  description:
    purpose: Install the governed Plugin through a verified Codex Marketplace CLI.
      Support both the maintainer-only local artifact adapter and native Windows
      and Linux user installers that provision bounded dependencies and consume
      the generated governed Marketplace branch.
    diagram_summaries:
      zh-TW: 註冊本機 Marketplace、安裝外掛並開啟 Codex 詳情頁
    input_ports: []
    output_ports:
    - local-install.result
    emitted_events:

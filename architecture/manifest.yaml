boundary_mappings:
- id: routing-assessments-to-guided-handoff
  interaction: Combine workflow-owned intent and project state with risk-owned gate
    evidence without letting either sibling depend directly on the other.
  producer: risk_routing_domain
  consumer: workflow_routing_domain
  parent: guided_workflow_router
  producer_contract: routing-decision
  consumer_contract: guided-route-decision
  mapping_owner: guided_workflow_router
  state_objects: []
  allowed_edges:
  - guided_workflow_router->risk_routing_domain
  - guided_workflow_router->workflow_routing_domain
  forbidden_edges:
  - risk_routing_domain->workflow_routing_domain
  - workflow_routing_domain->risk_routing_domain
- id: canonical-spec-to-delivery-context
  interaction: Project the child-owned canonical specification result into its parent
    delivery workflow without leaking the child contract to a sibling.
  producer: spec_governance_domain
  consumer: delivery_workflow_domain
  parent: delivery_workflow_domain
  producer_contract: canonical-spec-reference
  consumer_contract: delivery-spec-context
  mapping_owner: delivery_workflow_domain
  state_objects: []
  allowed_edges:
  - delivery_workflow_domain->spec_governance_domain
  forbidden_edges:
  - spec_governance_domain->delivery_workflow_domain
- id: delivery-spec-to-routing-context
  interaction: Convert delivery-owned canonical specification evidence into the
    routing domain's request-to-spec context without creating a sibling dependency.
  producer: delivery_workflow_domain
  consumer: workflow_routing_domain
  parent: guided_workflow_router
  producer_contract: delivery-spec-context
  consumer_contract: spec-context-assessment
  mapping_owner: guided_workflow_router
  state_objects: []
  allowed_edges:
  - guided_workflow_router->delivery_workflow_domain
  - delivery_workflow_domain->spec_governance_domain
  - guided_workflow_router->workflow_routing_domain
  forbidden_edges:
  - spec_governance_domain->workflow_routing_domain
  - workflow_routing_domain->delivery_workflow_domain
flows:
- id: verification-ladder-planning
  owner: governance_workflow_domain
  description: Validate project-owned verification bindings, combine universal hard
    triggers with project rules, and produce the lowest sufficient additive ladder
    without accepting evidence from a lower-authority environment.
  trigger:
    kind: command
    ref: verification-ladder.plan
    description: A modifying change identifies affected module contracts, execution
      changes, or evidence claims that require a verification plan.
  steps:
  - id: verification-ladder-planning.evaluate
    order: 1
    module: verification_ladder_domain
    action: Resolve architecture and on-device references, validate the project
      matrix, apply universal evidence-authority hard triggers, add project-selected
      layers, and return PASS or BLOCKED with explicit rationale.
    receives:
    - verification-ladder.plan
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: Every requested trigger is mapped to explicit criteria and the returned
      ordered layers are sufficient for each evidence claim.
    events: []
  errors: []
- id: local-plugin-installation
  owner: plugin_assembly_composition
  description: Select one compatible Python interpreter, recover safe access to only
    the exact ignored Windows artifact when necessary, assemble and validate the
    root-owned Plugin, apply a local-only cache identity, then register and install
    it before opening the Codex Desktop detail page.
  trigger:
    kind: command
    ref: plugin-install.local
    description: The user launches Install Governed Engineering Skills.cmd.
  steps:
  - id: local-plugin-installation.select-python
    order: 1
    module: python_runtime_discovery_adapter
    action: Validate an explicit Python command when supplied; otherwise accept a
      compatible PATH Python or resolve the Windows Python Launcher's highest Python
      3 runtime to one validated absolute interpreter path.
    receives:
    - python-runtime.select
    emits: []
    state_changes: []
    side_effects: []
  - id: local-plugin-installation.recover-artifact-access
    order: 2
    module: windows_artifact_access_adapter
    action: Confirm that the exact dist/governed-engineering-skills output is safely
      replaceable; when an existing Windows artifact is inaccessible, try a bounded
      inherited-ACL repair without elevation and request UAC only if that attempt fails.
    receives:
    - plugin-artifact-access.repair
    emits: []
    state_changes: []
    side_effects:
    - Repair inherited ACLs only on the exact ignored dist/governed-engineering-skills
      artifact after rejecting unsafe paths and reparse points.
  - id: local-plugin-installation.assemble
    order: 3
    module: plugin_assembly_composition
    action: Build the complete Plugin from the tracked shell and promoted root
      Skills, then reject missing, stale, or fingerprint-mismatched output.
    receives:
    - plugin-install.local
    emits: []
    state_changes: []
    side_effects:
    - Replace only the ignored dist/governed-engineering-skills candidate.
  - id: local-plugin-installation.localize
    order: 4
    module: plugin_assembly_composition
    action: Apply a local-only cache identity to the validated artifact and
      regenerate its inventory without changing formal release metadata.
    receives: []
    emits: []
    state_changes: []
    side_effects:
    - Mutate only the ignored dist/governed-engineering-skills candidate.
  - id: local-plugin-installation.register
    order: 5
    module: local_install_adapter
    action: Select an executable Codex CLI using verified PATH-first resolution
      with Desktop-runtime fallback, register the repository-local Marketplace,
      install the Plugin, and open its detail page.
    receives:
    - local-install.register
    emits: []
    state_changes: []
    side_effects:
    - Update the current user's Codex Marketplace configuration.
    - Install the Plugin into the current user's Codex cache.
    - Open the Codex Desktop Plugin detail page.
  success:
    result: Codex recognizes the local Marketplace entry and reports successful
      installation from the validated, locally cache-busted artifact.
    events: []
  errors:
  - condition: The explicit, PATH, and Windows Python Launcher candidates do not
      yield a validated Python 3.11-or-newer absolute interpreter.
    event: plugin-distribution.blocked
    handling: Stop before artifact mutation, report observed candidates and versions,
      and provide Python installation or explicit-selection recovery guidance.
  - condition: Assembly or artifact validation fails.
    event: plugin-distribution.blocked
    handling: Stop before invoking Codex or changing user configuration and report
      the failed validation boundary.
  - condition: The existing ignored artifact is inaccessible and exact-target safety,
      reparse-point rejection, non-elevated repair, UAC approval, or post-repair access
      validation fails.
    event: plugin-distribution.blocked
    handling: Stop before assembly and Codex registration, leave unrelated paths
      untouched, return a stable non-zero status, and identify the rejected safety
      boundary or UAC recovery action.
  - condition: Codex resolution, Marketplace registration, Plugin installation,
      or Plugin-page launch fails.
    event: local-install.blocked
    handling: Preserve the validated artifact, issue no removal command against a
      prior Plugin install, return a stable non-zero exit code, and provide the log
      and retry action. A Marketplace registered before installation failure remains
      registered for that retry.
- id: governed-engineering-route
  owner: guided_workflow_router
  description: Automatically classify every software-engineering request and
    turn-boundary decision handoff, inspect project state, preserve risk gates, and
    select an immediate safe skill.
  trigger:
    kind: command
    ref: guided-routing.route
    description: The user states a software-engineering intent, answers a new turn,
      or an active skill is about to ask a repository-modifying design or
      specification question; no ask-matt invocation is required.
  steps:
  - id: governed-engineering-route.assess
    order: 1
    module: workflow_routing_domain
    action: Classify ordered hard intent including exact fresh-task confirmed-Spec
      resume, preserve caller-supplied unresolved-decision evidence from before the
      first design question through answer reconciliation, and assess implementation
      and durable context from repository evidence.
    receives:
    - workflow-routing.assess-project
    - repository-evidence.collect
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-engineering-route.classify-risk
    order: 2
    module: risk_routing_domain
    action: Match ordered risk hard triggers and preserve the required governance gates.
    receives:
    - risk-routing.classify
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-engineering-route.select
    order: 3
    module: workflow_routing_domain
    action: Apply explicit-skill, intent, project-state, confirmed-spec resume
      evidence, unresolved-decision handoff, risk-gate, capability, and wayfinder
      precedence to produce the authoritative GuidedRouteDecision.
    receives:
    - workflow-routing.select
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: A PASS or DEGRADED decision selects an immediate safe handoff; pending
      design or specification decisions select grilling before the previous skill
      asks them and name spec-governance as the immediate reconciliation target,
      while invalid evidence or missing non-substitutable capability returns BLOCKED.
    events: []
  errors: []
- id: governed-change-set-lifecycle
  owner: delivery_workflow_domain
  description: Persist and reconcile one modifying change set into a canonical
    specification, materialize it when decision-complete, wait for product execution
    authorization, verify traceability, implement it, and close it only after Spec
    review and commit disposition pass.
  trigger:
    kind: command
    ref: spec-governance.reconcile
    description: A modifying engineering discussion confirms one new statement.
  steps:
  - id: governed-change-set-lifecycle.start
    order: 1
    module: spec_governance_domain
    action: Create, transactionally migrate, or resolve one project-root flat
      WORKING-SPEC pair before the first decision question; migration validates a
      complete temporary pair and restores the legacy source on failure.
    receives:
    - spec-governance.start
    emits: []
    state_changes: []
    side_effects:
    - Write one local authoritative WORKING-SPEC Markdown snapshot with structured
      Discussion Context and one normalized journal epoch.
  - id: governed-change-set-lifecycle.reconcile
    order: 2
    module: spec_governance_domain
    action: Classify the confirmed statement, update stable relationships, and report
      and persist the working specification delta, conflicts, and open decisions
      before another decision question.
    receives:
    - spec-governance.reconcile
    emits: []
    state_changes: []
    side_effects:
    - Atomically replace the working snapshot and append one normalized journal event
      containing affected REQ DEC AC and DISC identities without transcript prose.
  - id: governed-change-set-lifecycle.review-flow-cost
    order: 3
    module: governance_workflow_domain
    action: Review every material as-is and target Flow through functional
      admission, execution and real-time feasibility, maintainability and
      extensibility change scenarios, and model assurance; keep unresolved
      load-bearing evidence BLOCKED.
    receives: []
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.materialize
    order: 4
    module: spec_governance_domain
    action: Materialize the decision-complete canonical specification under specs/
      without granting product execution authorization.
    receives:
    - spec-governance.materialize
    emits: []
    state_changes: []
    side_effects:
    - Write one canonical specification revision.
  - id: governed-change-set-lifecycle.authorize
    order: 5
    module: delivery_workflow_domain
    action: Present the confirmed specification and wait for exact product execution
      authorization; reopen it before clarification when a possible contract change
      appears.
    receives:
    - spec-governance.reopen
    emits: []
    state_changes: []
    side_effects:
    - Reopen one confirmed unimplemented specification in place when required.
  - id: governed-change-set-lifecycle.publish
    order: 6
    module: delivery_workflow_domain
    action: Publish a tracker snapshot that names the repository specification as canonical.
    receives: []
    emits: []
    state_changes: []
    side_effects:
    - Create or update one tracker Issue when configured.
  - id: governed-change-set-lifecycle.verify
    order: 7
    module: spec_governance_domain
    action: Verify requirement-to-acceptance-to-validation traceability and return
      to grilling only when the request introduces a new decision or conflict.
    receives:
    - spec-governance.verify
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.formatter-gate
    order: 8
    module: formatter_governance_domain
    action: Select the repository formatter policy or governed fallback, confirm and
      protect any full-program write, reject ambiguous, colliding, or dirty targets,
      and require an available CLI formatter plus a passing non-mutating check before
      product-code mutation.
    receives:
    - formatter-governance.evaluate
    emits:
    - formatter-governance.blocked
    state_changes: []
    side_effects:
    - Create only collision-free minimal scaffold and formatter configuration when
      the confirmed change set targets a greenfield project.
    - Format clean product source and tests only after affirmative confirmation and
      follow the write with the selected formatter CLI's non-mutating check.
  - id: governed-change-set-lifecycle.implement-review
    order: 9
    module: delivery_workflow_domain
    action: Implement through the agreed test seams, run two-axis review, and mark
      the canonical specification implemented only after the Spec axis passes.
    receives: []
    emits: []
    state_changes: []
    side_effects:
    - Update the canonical specification with PASS evidence and implemented status.
  - id: governed-change-set-lifecycle.prepare-commit
    order: 10
    module: spec_governance_domain
    action: Reject staged local working state and require delete, keep-local, or
      archive disposition before the delivery workflow commits.
    receives:
    - spec-governance.prepare-commit
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: The implemented behavior is traceable to one canonical specification
      whose requirements and acceptance criteria have verified PASS evidence.
    events: []
  errors:
  - condition: Reconciliation finds an unresolved conflict or conclusion-changing decision.
    event: spec-governance.blocked
    handling: Remain in grilling and ask exactly one conclusion-changing question.
  - condition: A material Flow has unresolved platform units, cost paths, budgets,
      model error, reserve, interference, or scenario coverage.
    event: spec-governance.blocked
    handling: Preserve directional analysis but keep the performance or real-time
      claim BLOCKED until the required evidence is calibrated.
  - condition: Canonical materialization succeeds but tracker publication fails.
    event: delivery.tracker-publication-pending
    handling: Preserve the canonical specification and report BLOCKED with a retry target.
  - condition: Local working state is staged or its retention disposition is missing.
    event: spec-governance.blocked
    handling: Preserve the bundle, block commit, and ask exactly one disposition question.

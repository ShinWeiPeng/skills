  - {name: question, type: string, role: domain-value, meaning: Conclusion-changing question.}
  - {name: options_and_tradeoffs, type: string, role: policy, meaning: Considered choices and material tradeoffs.}
  - {name: user_answer, type: string, role: domain-value, meaning: Visible original user answer after required redaction.}
  - {name: explicit_rationale, type: string, role: domain-value, meaning: User-stated rationale or not stated.}
  - {name: resulting_impact, type: string-array, role: metadata, meaning: Affected REQ DEC and AC identities.}
- id: spec-consistency-assessment
  owner: spec_governance_domain
  language: json-schema
  declaration:
    path: skills/engineering/spec-governance/references/spec-contract.schema.json
    symbol: SpecConsistencyAssessment

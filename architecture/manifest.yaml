    type: nullable-string
    role: domain-identity
    meaning: Project-relative canonical specification path selected for this change set.
  - name: candidates
    type: string-array
    role: metadata
    meaning: Deterministically ordered matching specification paths.
  - name: reason
    type: string
    role: metadata
    meaning: Evidence-backed explanation of selection or ambiguity.

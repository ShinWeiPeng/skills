  owner: workflow_routing_domain
  direction: input
  kind: query
  contract: skills/engineering/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Convert repository evidence into a three-state implementation and documentation assessment.
    data: Read-only tracked and non-ignored untracked path evidence.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: Evidence does not satisfy the RepositoryEvidence contract.
  symbols:
  - assess_project_state
- id: workflow-routing.select
  owner: workflow_routing_domain
  direction: input
  kind: query
  contract: skills/engineering/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Select the authoritative skill handoff after intent, project state, risk,
      capability, and complexity checks.
    data: IntentAssessment, ProjectStateAssessment, RoutingDecision, capabilities,
      wayfinder threshold evidence, exact fresh-task confirmed-Spec resume intent,
      and caller-supplied unresolved-decision lifecycle evidence for a
      non-discoverable choice that shapes the change set.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: Any required assessment is missing or malformed.
  symbols:
  - select_workflow
- id: repository-evidence.collect
  owner: workflow_routing_domain
  direction: output
  kind: query
  contract: skills/engineering/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by:
  - repository_evidence_adapter
  description:
    purpose: Read repository paths and Git tracking status for project-state assessment.
    data: One project root produces normalized RepositoryEvidence rows.
    timing: sync
    immediate_rejections:
    - code: unavailable
      condition: The root is unreadable or Git evidence collection fails.
  symbols:
  - RepositoryEvidencePort
- id: spec-governance.start
  owner: spec_governance_domain
  direction: input
  kind: command
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Create, migrate, or resolve one flat project-root working specification pair.
    data: Project root, change-set slug and optional working, task, or branch evidence
      produce one immutable WorkingSpecReference.
    timing: sync
    immediate_rejections:
    - code: ambiguous
      condition: More than one working specification matches without an explicit reference.
  symbols:
  - spec-governance
- id: formatter-governance.evaluate
  owner: formatter_governance_domain
  direction: input
  kind: query
  contract: skills/engineering/formatter-governance/references/formatter-policy-request.schema.json
  implemented_by: []
  description:
    purpose: Evaluate formatter selection, exact-root scaffold safety, full-program
      confirmation and scope, and the pre-product mutation gate through one stable
      CLI contract.
    data: ProjectState, language or repository formatter identity and argv, exact
      root and scaffold paths, prior evidence statuses, tool availability, check
      status, canonical SPEC, confirmation, clean-target evidence, CLI write and
      check outcomes, and native permission outcome.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: Required structured input or exact-root evidence is missing or malformed.
  symbols:
  - main
- id: formatter-governance.result
  owner: formatter_governance_domain
  direction: output
  kind: event
  contract: skills/engineering/formatter-governance/references/formatter-policy-result.schema.json
  implemented_by: []
  description:
    purpose: Publish the formatter policy PASS or BLOCKED decision with bounded evidence.
    data: Project kind and root, formatter identity, check and write argv, program
      and dirty file scopes, confirmation, installation and execution outcomes,
      mutation allowances, and diagnostic reason.
    timing: sync
    immediate_rejections: []
  symbols:
  - main
- id: spec-governance.reconcile
  owner: spec_governance_domain
  direction: input
  kind: command
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Reconcile and persist one newly confirmed discussion statement before
      another decision question.
    data: Expected working revision and hash, existing durable context, and one confirmed
      statement produce a new snapshot, normalized journal event, and consistency verdict.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: The statement or working specification is malformed.
    - code: stale
      condition: Expected revision or snapshot hash differs from persisted state.
  symbols:
  - spec-governance
- id: spec-governance.materialize
  owner: spec_governance_domain
  direction: input
  kind: command
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Persist one decision-complete working specification as the canonical repository artifact.
    data: A PASS SpecConsistencyAssessment produces one versioned Markdown specification
      without granting product execution authority.
    timing: sync
    immediate_rejections:
    - code: unresolved
      condition: Conflicts, open decisions, invalid relations, or uncovered requirements remain.
  symbols:
  - spec-governance
- id: spec-governance.reopen
  owner: spec_governance_domain
  direction: input
  kind: command
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Reopen a confirmed unimplemented specification in place before clarifying
      a possible contract change.
    data: Expected canonical revision, reason, and specification path produce a working
      canonical revision plus a local flat WORKING-SPEC pair.
    timing: sync
    immediate_rejections:
    - code: implemented
      condition: The specification has already reached implemented status.
    - code: stale
      condition: Expected revision differs from the canonical specification.
  symbols:
  - spec-governance
- id: spec-governance.prepare-commit
  owner: spec_governance_domain
  direction: input
  kind: query
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Detect staged local WORKING-SPEC pairs and require an explicit retention disposition.
    data: Project Git state and known working pairs produce delete, keep-local, or
      archive choices without performing Git actions.
    timing: sync
    immediate_rejections:
    - code: staged-local-state
      condition: A path under project-root spec-governance is tracked or staged.
  symbols:
  - spec-governance
- id: spec-governance.verify
  owner: spec_governance_domain
  direction: input
  kind: query
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Verify a canonical specification and its requirement-to-validation traceability.
    data: A resolved canonical specification and current request produce a PASS or BLOCKED assessment.
    timing: sync
    immediate_rejections:
    - code: ambiguous
      condition: More than one canonical specification matches the current change set.
    - code: invalid
      condition: The selected specification violates the structural contract.
  symbols:
  - spec-governance
- id: spec-governance.result
  owner: spec_governance_domain
  direction: output
  kind: event
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Publish one specification lifecycle result to the delivery parent.
    data: Consistency or traceability verdict with canonical specification identity.
    timing: sync
    immediate_rejections: []
  symbols:
  - spec-governance
- id: delivery-workflow.result
  owner: delivery_workflow_domain
  direction: output
  kind: event
  contract: skills/engineering/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Publish delivery failures that preserve a valid canonical specification.
    data: Canonical specification identity and the pending external delivery action.
    timing: sync
    immediate_rejections: []
  symbols:
  - implement
- id: libclang_toolchain.resolve
  owner: governance_workflow_domain
  direction: output
  kind: query
  contract: skills/engineering/govern-modular-event-architecture/scripts/libclang_toolchain_contract.py
  implemented_by:
  - libclang_toolchain_adapter
  description:
    purpose: Resolve, bind, and verify one lock-pinned target-capable libclang provider.
    data: Toolchain lock and operation mode produce immutable provider evidence
      or fail-closed CAST diagnostics.
    timing: sync
    immediate_rejections:
    - code: CAST001
      condition: Provider or Xtensa capability is unavailable.
    - code: CAST002
      condition: Lock, platform, cache, or receipt is invalid.
  symbols:
  - LibclangToolchainPort
events:
- id: formatter-governance.blocked
  owner: formatter_governance_domain
  output_port: formatter-governance.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Report that formatter selection, scaffold safety, permission, or the
      non-mutating check prevents delivery from continuing.
    emitted_when: Any formatter-governance prerequisite fails closed.
    payload_fields:
    - {name: reason, type: string, meaning: Bounded formatter-policy diagnostic.}
    intended_consumers: [delivery_workflow_domain]
- id: local-install.blocked
  owner: local_install_adapter
  output_port: local-install.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Report that local Codex installation cannot continue safely.
    emitted_when: Artifact validation, Codex resolution, Marketplace registration, Plugin installation, or page launch fails.
    payload_fields:
    - {name: reason, type: string, meaning: Bounded installation diagnostic and recovery action.}
    intended_consumers: [plugin_assembly_composition]
- id: plugin-distribution.blocked
  owner: plugin_assembly_composition
  output_port: plugin-distribution.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Report that Python admission, bounded artifact-access recovery, Plugin assembly,
      or personal Marketplace publication cannot continue safely.
    emitted_when: Python runtime, exact-target ACL recovery, artifact, publication,
      evidence, or output-ownership validation fails.
    payload_fields:
    - {name: reason, type: string, meaning: Bounded fail-closed validation diagnostic.}
    intended_consumers: [plugin_release_governance_technical]
- id: plugin-integration.blocked
  owner: integration_validation_technical
  output_port: plugin-integration.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Report that the assembled Plugin violates an integration contract.
    emitted_when: Inventory, metadata, portability, or isolation validation fails.
    payload_fields:
    - {name: reason, type: string, meaning: Bounded integration diagnostic.}
    intended_consumers: [plugin_release_governance_technical]
- id: plugin-release.blocked
  owner: plugin_release_governance_technical
  output_port: plugin-release.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Report that the stable release identity is inconsistent.
    emitted_when: Version, changeset, tag, or release-intent validation fails.
    payload_fields:
    - {name: reason, type: string, meaning: Bounded release-governance diagnostic.}
    intended_consumers: [plugin_assembly_composition]
- id: spec-governance.blocked
  owner: spec_governance_domain
  output_port: spec-governance.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Tell delivery orchestration that specification work cannot continue safely.
    emitted_when: A reconciliation or verification has unresolved blocking evidence.
    payload_fields:
    - name: verdict
      type: string
      meaning: BLOCKED specification verdict.
    - name: reason
      type: string
      meaning: Conflict, ambiguity, or missing traceability that must be resolved.
    intended_consumers:
    - delivery_workflow_domain
- id: delivery.tracker-publication-pending
  owner: delivery_workflow_domain
  output_port: delivery-workflow.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Preserve durable context while reporting that its tracker snapshot remains pending.
    emitted_when: Canonical materialization succeeds and tracker publication fails.
    payload_fields:
    - name: canonical_spec
      type: CanonicalSpecReference
      meaning: The repository specification that remains authoritative and retryable.
    intended_consumers:
    - guided_workflow_router
types:
- id: plugin-distribution-error

  - {name: rollback, type: object, role: policy, meaning: Prior validated publication commit and recovery method.}
  - {name: evidence_checklist, type: string-array, role: metadata, meaning: Optional Codex publication verification observations.}
- id: repository-artifact
  owner: workflow_routing_domain

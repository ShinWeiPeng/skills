  - name: change_set
    type: string
    role: metadata
    meaning: Stable lowercase change-set slug.
  - name: task_ref
    type: string-or-null
    role: metadata
    meaning: Optional task evidence used after an explicit reference.
  - name: branch_ref
    type: string-or-null
    role: metadata
    meaning: Optional branch evidence used after task evidence.

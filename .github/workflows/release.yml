name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      engineering: ${{ steps.detect.outputs.governed-engineering-skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: detect
        run: >-
          python .github/scripts/package_release.py detect
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --github-output "$GITHUB_OUTPUT"

  governance-validation:
    needs: scope
    if: needs.scope.outputs.engineering == 'true'
    defaults:
      run:
        working-directory: governed-engineering-skills
    name: Governance / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned governance dependencies
        run: python -m pip install -r skills/engineering/govern-modular-event-architecture/requirements-architecture.txt

      - name: Cache official Espressif libclang provider
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/codex-toolchains
            ~/AppData/Local/CodexToolchains
          key: esp-clang-libs-${{ runner.os }}-20.1.1_20250829

      - name: Install official Espressif libclang provider
        run: >-
          python skills/engineering/govern-modular-event-architecture/scripts/architecture_cli.py
          toolchain install
          --lock skills/engineering/govern-modular-event-architecture/assets/project/toolchain-lock.yaml

      - name: Verify official Espressif libclang provider
        run: >-
          python skills/engineering/govern-modular-event-architecture/scripts/architecture_cli.py
          toolchain verify
          --lock skills/engineering/govern-modular-event-architecture/assets/project/toolchain-lock.yaml

      - name: Run governance unit tests
        run: python -m unittest discover -s tests/modules/governance_workflow_domain/architecture -p "test_*.py" -v

      - name: Run test layout and immutable evidence contracts
        run: |
          python -m unittest discover -s tests/modules/governance_workflow_domain -p "test_*.py" -v
          python -m unittest discover -s tests/modules/verification_ladder_domain -p "test_*.py" -v
          python -m unittest discover -s tests/modules/verification_ladder_domain/ladder -p "test_*.py" -v
          python -m unittest discover -s tests/modules/governance_workflow_domain/device -p "test_*.py" -v

      - name: Assemble and validate shared Plugin distribution
        run: >-
          python scripts/assemble_plugin.py assemble
          && python scripts/validate_distribution.py
          && python scripts/assemble_plugin.py validate

      - name: Run shared distribution contract tests
        run: python -m unittest discover -s tests/flows/plugin-integration/distribution -p "test_*.py" -v

      - name: Run plugin integration validation
        run: python dist/governed-engineering-skills/scripts/validate_integration.py

      - name: Run assembled Plugin contract tests
        run: python -m unittest discover -s tests/flows/plugin-integration/plugin -p "test_*.py" -v

      - name: Run local installer contract tests
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File tests/flows/plugin-integration/plugin/test_install_local.ps1

      - name: Run bounded Windows artifact access contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File tests/flows/plugin-integration/plugin/test_windows_artifact_access.ps1

      - name: Run repository release gate
        run: >-
          python tools/architecture/architecture_cli.py
          gate --phase release
          --manifest ../architecture/manifest.yaml
          --adoption ../architecture/adoption.yaml
          --baseline ../architecture/baseline.yaml

  release-tooling-validation:
    needs: scope
    if: needs.scope.outputs.engineering == 'true'
    defaults:
      run:
        working-directory: governed-engineering-skills
    name: Release tooling / Governed plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rehearse tracked clean-checkout release
        run: python scripts/assemble_plugin.py rehearse

      - name: Validate governed plugin release metadata
        run: >-
          python scripts/assemble_plugin.py assemble
          && python scripts/validate_distribution.py
          && python plugins/governed-engineering-skills/scripts/version_governance.py check

  release:
    name: Version engineering package
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.scope.outputs.engineering == 'true'
    runs-on: ubuntu-latest
    needs: [scope, governance-validation, release-tooling-validation, package-contracts]
    concurrency:
      group: package-release-governed-engineering-skills
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create or update the engineering Version PR
        id: version
        run: >-
          python .github/scripts/package_release.py version
          --package governed-engineering-skills --github-output "$GITHUB_OUTPUT"
      - name: Publish the reviewed engineering version
        if: steps.version.outputs.changed == 'false'
        run: python .github/scripts/package_release.py publish --package governed-engineering-skills

  package-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests/flows/plugin-integration/monorepo -p "test_*.py" -v

  required-validation:
    if: always()
    runs-on: ubuntu-latest
    needs: [scope, governance-validation, release-tooling-validation, package-contracts]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] in ("success","skipped") for job in results.values()), results'

name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validate_marketplace_acceptance:
        description: Validate personal Marketplace installation and invocation evidence
        required: true
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  governance-validation:
    name: Governance / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned governance dependencies
        run: python -m pip install -r skills/engineering/govern-modular-event-architecture/requirements-architecture.txt

      - name: Cache official Espressif libclang provider
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/codex-toolchains
            ~/AppData/Local/CodexToolchains
          key: esp-clang-libs-${{ runner.os }}-20.1.1_20250829

      - name: Install official Espressif libclang provider
        run: >-
          python skills/engineering/govern-modular-event-architecture/scripts/architecture_cli.py
          toolchain install
          --lock skills/engineering/govern-modular-event-architecture/assets/project/toolchain-lock.yaml

      - name: Verify official Espressif libclang provider
        run: >-
          python skills/engineering/govern-modular-event-architecture/scripts/architecture_cli.py
          toolchain verify
          --lock skills/engineering/govern-modular-event-architecture/assets/project/toolchain-lock.yaml

      - name: Run governance unit tests
        run: python -m unittest discover -s skills/engineering/govern-modular-event-architecture/tests -p "test_*.py" -v

      - name: Assemble and validate shared Plugin distribution
        run: >-
          python scripts/assemble_plugin.py assemble
          && python scripts/validate_distribution.py
          && python scripts/assemble_plugin.py validate

      - name: Run shared distribution contract tests
        run: python -m unittest tests.test_shared_skill_distribution -v

      - name: Run plugin integration validation
        run: python dist/governed-engineering-skills/scripts/validate_integration.py

      - name: Run assembled Plugin contract tests
        run: python -m unittest discover -s plugins/governed-engineering-skills/tests -p "test_*.py" -v

      - name: Run skill release gate
        run: >-
          python skills/engineering/govern-modular-event-architecture/scripts/architecture_cli.py
          gate --phase release
          --manifest skills/engineering/govern-modular-event-architecture/architecture/manifest.yaml
          --adoption skills/engineering/govern-modular-event-architecture/architecture/adoption.yaml
          --baseline skills/engineering/govern-modular-event-architecture/architecture/baseline.yaml

      - name: Run plugin release gate
        run: >-
          python tools/architecture/architecture_cli.py
          gate --phase release
          --manifest architecture/manifest.yaml
          --adoption architecture/adoption.yaml
          --baseline architecture/baseline.yaml

  release-tooling-validation:
    name: Release tooling / Governed plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate governed plugin release metadata
        run: >-
          python scripts/assemble_plugin.py assemble
          && python scripts/validate_distribution.py
          && python plugins/governed-engineering-skills/scripts/version_governance.py check

  release:
    name: Version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - governance-validation
      - release-tooling-validation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve Marketplace rollback target
        id: marketplace-base
        shell: bash
        run: |
          previous="$(git ls-remote origin refs/heads/marketplace-release | awk '{print $1}')"
          if [ -z "$previous" ]; then
            previous="none:first-publication"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Rebuild the exact release and Marketplace candidates
        shell: bash
        run: |
          python scripts/assemble_plugin.py assemble \
            --marketplace-publication \
            --source-commit "$GITHUB_SHA" \
            --previous-publication-commit "${{ steps.marketplace-base.outputs.previous }}"
          python scripts/validate_distribution.py
          python scripts/assemble_plugin.py validate

      - name: Apply governed plugin release intent
        id: version
        shell: bash
        run: |
          python plugins/governed-engineering-skills/scripts/version_governance.py apply-intent
          python plugins/governed-engineering-skills/scripts/version_governance.py check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the governed plugin Version Pull Request
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="plugin-release/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: version governed engineering skills"
          git push --force-with-lease origin "HEAD:$branch"
          open_pr_url="$(
            gh pr list --state open --base main --head "$branch" \
              --limit 1 \
              --json url \
              --jq '.[0].url // ""'
          )"
          if [ -n "$open_pr_url" ]; then
            gh pr edit "$open_pr_url" \
              --title "chore: version governed engineering skills" \
              --body "Automated governed plugin version update."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: version governed engineering skills" \
              --body "Automated governed plugin version update."
          fi

      - name: Create missing governed plugin release tag
        if: steps.version.outputs.changed == 'false'
        shell: bash
        run: |
          tag="$(python plugins/governed-engineering-skills/scripts/version_governance.py tag)"
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [ -n "$remote_tag_commit" ] && [ "$remote_tag_commit" != "$GITHUB_SHA" ]; then
            echo "ERROR: Tag $tag points to stale commit $remote_tag_commit, expected $GITHUB_SHA."
            exit 1
          elif [ -n "$remote_tag_commit" ]; then
            echo "Tag $tag already identifies $GITHUB_SHA; no release tag is needed."
          else
            python plugins/governed-engineering-skills/scripts/version_governance.py tag --write
            git push origin "refs/tags/$tag"
          fi

      - name: Publish the generated personal Marketplace branch
        if: steps.version.outputs.changed == 'false'
        shell: bash
        run: |
          staging="$RUNNER_TEMP/marketplace-release"
          publication_worktree="$RUNNER_TEMP/marketplace-worktree"
          cp -R dist/marketplace-release "$staging"
          git worktree add --detach "$publication_worktree"
          git -C "$publication_worktree" switch --orphan marketplace-release-publication
          git -C "$publication_worktree" rm -rf .
          cp -R "$staging"/. "$publication_worktree"/
          git -C "$publication_worktree" add -A
          git -C "$publication_worktree" config user.name "github-actions[bot]"
          git -C "$publication_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publication_worktree" commit -m "chore: publish governed engineering skills marketplace"
          previous="${{ steps.marketplace-base.outputs.previous }}"
          if [ "$previous" = "none:first-publication" ]; then
            git -C "$publication_worktree" push origin HEAD:refs/heads/marketplace-release
          else
            git -C "$publication_worktree" push --force-with-lease="refs/heads/marketplace-release:$previous" \
              origin HEAD:refs/heads/marketplace-release
          fi

  marketplace-acceptance:
    name: Personal Marketplace acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.validate_marketplace_acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout evidence and validators
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout generated Marketplace publication
        uses: actions/checkout@v4
        with:
          ref: marketplace-release
          path: publication

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate personal Marketplace release and invocation evidence
        shell: bash
        run: |
          branch_commit="$(git -C publication rev-parse HEAD)"
          python source/scripts/validate_personal_marketplace_release.py \
            --repo-root source \
            --artifact publication/plugins/governed-engineering-skills \
            --publication publication/publication-record.json \
            --branch-commit "$branch_commit"

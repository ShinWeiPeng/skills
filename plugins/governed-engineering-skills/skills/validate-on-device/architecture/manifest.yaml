standard_version: 1.1.0
schema_version: 1.1.0
project:
  name: validate-on-device
  documentation_language: zh-TW
modules:
- id: validation_session
  level: L0
  role: composition
  parent: null
  depends_on: [collection_domain, verdict_domain, platform_adapters]
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 協調enablement、smoke與acceptance runtime scenario，並彙總結構化Gate 1與四階段驗證證據。
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Acceptance scenario必須引用同一profile的enablement PASS bundle。
    - Validation image的證據不得替代獨立的release acceptance。
    - Host-side Fake Port與unit測試不由runtime runner執行；必要smoke只支援Gate 1且不得滿足Gate 2。
  paths: [scripts/validate_on_device.py]
  entrypoints:
  - {path: scripts/validate_on_device.py, symbol: main, kind: cli_entrypoint}
  public_symbols:
  - {path: scripts/validate_on_device.py, symbol: main, kind: entrypoint}
- id: collection_domain
  level: L1
  role: domain
  parent: validation_session
  depends_on: [profile_contract, guided_session_contract]
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 驗證profile、執行能力探測與bounded action/capture，並保存guided事實。
    input_ports: [collection.input]
    output_ports: [collection.output, collection.transport]
    emitted_events: [validation.capabilities_probed, validation.guided_response_recorded, validation.evidence_captured]
    owned_state: []
    side_effects:
    - {description: 透過transport adapter擷取或匯入bounded evidence。, via_port: collection.transport}
    errors: []
    invariants:
    - Capture同時受scenario max_duration_ms、transport timeout與max_bytes限制。
    - Serial/TCP只在匹配run、scenario與completion reason後提早結束。
  paths: [scripts/vod/execution.py]
  entrypoints:
  - {path: scripts/vod/execution.py, symbol: run_action, kind: command_handler}
  public_symbols:
  - {path: scripts/vod/execution.py, symbol: CollectionInputPort, kind: port}
  - {path: scripts/vod/execution.py, symbol: CollectionOutputPort, kind: port}
  - {path: scripts/vod/execution.py, symbol: TransportPort, kind: port}
- id: verdict_domain
  level: L1
  role: domain
  parent: validation_session
  depends_on: [evidence_matcher]
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 重算runtime criterion、逐修改Gate 1文件與overall gate證據，合成PASS、FAIL或BLOCKED。
    input_ports: [verdict.input]
    output_ports: [verdict.output]
    emitted_events: [validation.verdict_recorded]
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Overall precedence固定為FAIL高於BLOCKED高於PASS。
    - 未證明trigger時不得把缺少流程事件判為產品FAIL。
    - Gate 1必須逐change group驗證風險、命令、exit code、hashed evidence與smoke決策。
    - Governed external Port或L3+ Adapter變更必須包含port-contract check。
    - 作者宣告的Gate 1 verdict不得覆寫runner重算結果。
  paths: [scripts/vod/model.py]
  entrypoints:
  - {path: scripts/vod/model.py, symbol: overall, kind: query_handler}
  public_symbols:
  - {path: scripts/vod/model.py, symbol: VerdictInputPort, kind: port}
  - {path: scripts/vod/model.py, symbol: VerdictOutputPort, kind: port}
  - {path: scripts/vod/model.py, symbol: overall_gates, kind: query}
- id: profile_contract
  level: L2
  role: component
  parent: collection_domain
  depends_on: []
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 驗證tracked profile v1.0、local binding、scenario phase/completion、sample plan與選填的人類可讀測試說明。
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - 每個scenario明確宣告phase、evidence mode、max duration與completion criteria。
    - Acceptance prerequisites只能引用enablement scenario。
    - Statistical與native criteria使用可重算或外部標準sample plan。
    - Tracked profile不得包含literal secrets，action只能使用executable與argv。
    - Scenario title/purpose與criterion label/description維持選填；存在時必須是非空字串，缺少時不得使既有profile失效。
  paths: [scripts/vod/profile.py]
  entrypoints:
  - {path: scripts/vod/profile.py, symbol: load_profile, kind: query_handler}
  public_symbols:
  - {path: scripts/vod/profile.py, symbol: validate_profile, kind: validator}
- id: guided_session_contract
  level: L2
  role: component
  parent: collection_domain
  depends_on: []
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 定義immutable guided session、fact-only response revisions、confirmation與read-only review。
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state:
    - {name: response_revision, description: 目前revision與前一版canonical hash。}
    side_effects: []
    errors:
    - id: guided_schema_invalid
      condition: Session或response不符合strict schema。
      event: validation.guided_response_recorded
      handling: 產生BLOCKED review且不接納criterion evidence。
    - id: guided_step_incomplete
      condition: Required step缺少、pending、blocked或未確認。
      event: validation.guided_response_recorded
      handling: 保存部分事實與修復建議，維持BLOCKED。
    invariants:
    - 使用者只提供觀察事實，不提供PASS或FAIL。
    - Markdown review只是projection，不作為權威證據。
  paths: [scripts/vod/guided.py]
  entrypoints:
  - {path: scripts/vod/guided.py, symbol: finalize_response, kind: command_handler}
  public_symbols:
  - {path: scripts/vod/guided.py, symbol: GuidedSessionInputPort, kind: port}
  - {path: scripts/vod/guided.py, symbol: GuidedSessionOutputPort, kind: port}
- id: evidence_matcher
  level: L2
  role: component
  parent: verdict_domain
  depends_on: []
  implements_ports: []
  implementation_status: implemented
  description:
    purpose: 解析VAL evidence，驗證完整性、flow completion、sample sufficiency與native correlation。
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Flow缺項只有在trigger與完整bounded window已證明時才判FAIL。
    - Sample不足、trace loss、sequence gap或量測超預算皆判BLOCKED。
    - Supported OS resource criteria不可由structured-log fallback取得PASS。
  paths: [scripts/vod/evidence.py]
  entrypoints:
  - {path: scripts/vod/evidence.py, symbol: evaluate, kind: query_handler}
  public_symbols:
  - {path: scripts/vod/evidence.py, symbol: write_bundle, kind: evidence_writer}
- id: platform_adapters
  level: L3+
  role: adapter
  parent: null
  depends_on: [collection_domain]
  implements_ports: [collection.transport]
  implementation_status: implemented
  description:
    purpose: 適配Windows、Linux、iOS、Serial、TCP、process與file evidence來源。
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Windows/Linux/iOS scheduler與resource criteria必須使用對應native provider。
    - Native trace、normalized evidence與application events使用run ID及monotonic marker關聯。
  paths: [scripts/vod/providers.py]
  entrypoints:
  - {path: scripts/vod/providers.py, symbol: probe, kind: adapter_entrypoint}
  public_symbols:
  - {path: scripts/vod/providers.py, symbol: PlatformTransportAdapter, kind: adapter}
ports:
- id: collection.input
  owner: collection_domain
  direction: input
  kind: command
  contract: scripts/vod/execution.py
  implemented_by: []
  description:
    purpose: 接受validated scenario、bounded collection或action command。
    data: Profile、phase、scenario、risk approvals與evidence output path。
    timing: async
    immediate_rejections:
    - {code: unavailable, condition: Required capability、permission或enablement evidence缺少。}
  symbols: [CollectionInputPort]
- id: collection.output
  owner: collection_domain
  direction: output
  kind: event
  contract: scripts/vod/execution.py
  implemented_by: []
  description:
    purpose: 發布能力、guided response與capture完成狀態。
    data: Run ID、phase、provider state、completion cause與bounded evidence location。
    timing: async
    immediate_rejections: []
  symbols: [CollectionOutputPort]
- id: collection.transport
  owner: collection_domain
  direction: output
  kind: dependency
  contract: scripts/vod/execution.py
  implemented_by: [platform_adapters]
  description:
    purpose: 執行平台、Serial、TCP、process與file transport。
    data: Bounded bytes、native trace exports與external process results。
    timing: async
    immediate_rejections:
    - {code: blocked, condition: Endpoint、native provider、approval或cleanup unavailable。}
  symbols: [TransportPort]
- id: verdict.input
  owner: verdict_domain
  direction: input
  kind: command
  contract: scripts/vod/model.py
  implemented_by: []
  description:
    purpose: 接受runtime criterion、逐修改development gate與release gate evidence。
    data: Criterion results、change groups、architecture refs、commands、exit codes、hashed artifacts、smoke references、phase、profile hash與prerequisite bundles。
    timing: sync
    immediate_rejections:
    - {code: blocked, condition: Development gate缺少change group、風險、check、hash、contract coverage或matching smoke result。}
  symbols: [VerdictInputPort]
- id: verdict.output
  owner: verdict_domain
  direction: output
  kind: event
  contract: scripts/vod/model.py
  implemented_by: []
  description:
    purpose: 發布scenario或overall gate判定。
    data: PASS、FAIL或BLOCKED及其evidence anchors。
    timing: async
    immediate_rejections: []
  symbols: [VerdictOutputPort]
events:
- id: validation.capabilities_probed
  owner: collection_domain
  output_port: collection.output
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: 指出enablement所需provider、transport與action能力是否存在。
    emitted_when: Passive probe與profile validation完成。
    payload_fields:
    - {name: provider, type: string, meaning: Requested與actual evidence provider。}
    - {name: status, type: enum, meaning: PASS或BLOCKED capability state。}
    intended_consumers: [validation_session]
- id: validation.guided_response_recorded
  owner: collection_domain
  output_port: collection.output
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: 指出fact-only guided revision與read-only review已驗證。
    emitted_when: Identity、revision chain、confirmation與evidence references完成驗證。
    payload_fields:
    - {name: run_id, type: string, meaning: Immutable session nonce。}
    - {name: revision, type: integer, meaning: Validated response revision。}
    - {name: completion_state, type: enum, meaning: READY或BLOCKED evidence admission state。}
    intended_consumers: [validation_session, verdict_domain]
- id: validation.evidence_captured
  owner: collection_domain
  output_port: collection.output
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: 指出bounded raw或native evidence已捕捉、匯入或被阻擋。
    emitted_when: Capture達到matching completion、duration/bytes boundary或adapter failure。
    payload_fields:
    - {name: evidence_path, type: path, meaning: Bounded raw evidence location。}
    - {name: phase, type: enum, meaning: enablement、smoke或acceptance。}
    - {name: completion_seen, type: boolean, meaning: Matching session end是否已觀察。}
    intended_consumers: [validation_session, verdict_domain]
- id: validation.verdict_recorded
  owner: verdict_domain
  output_port: verdict.output
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: 保存criterion、scenario與四階段gate的PASS、FAIL或BLOCKED判定。
    emitted_when: Evidence completeness、development change groups、completion、sample plan與prerequisites完成評估。
    payload_fields:
    - {name: verdict, type: enum, meaning: PASS、FAIL或BLOCKED。}
    - {name: phase, type: enum, meaning: Scenario validation phase。}
    - {name: profile_sha256, type: string, meaning: Bound profile snapshot hash。}
    intended_consumers: [validation_session]
flows:
- id: guided-validation
  owner: validation_session
  description: 從enablement能力建立、guided capture到acceptance prerequisite與verdict的runtime證據流程。
  trigger:
    kind: command
    ref: collection.input
    description: 使用者或Codex要求執行一個profile-declared scenario。
  steps:
  - order: 1
    module: collection_domain
    action: 驗證profile與phase；probe能力；建立immutable guided session並驗證response chain。
    receives: [collection.input]
    emits: [validation.capabilities_probed, validation.guided_response_recorded]
    state_changes: []
    side_effects: [寫入session、response template與deterministic review artifacts。]
  - order: 2
    module: collection_domain
    action: 依scenario max duration、transport timeout與max bytes擷取或匯入raw/native evidence。
    receives: [collection.input]
    emits: [validation.evidence_captured]
    state_changes: []
    side_effects: [保存raw、native、guided與hash artifacts。]
  - order: 3
    module: verdict_domain
    action: 驗證trigger、required flow、sample sufficiency、native correlation與enablement prerequisites。
    receives: [verdict.input]
    emits: [validation.verdict_recorded]
    state_changes: []
    side_effects: [寫入criterion與scenario result bundle。]
  success:
    result: Scenario及所有required criteria具有PASS evidence。
    events: [validation.verdict_recorded]
  errors:
  - condition: Capability、trigger、window、samples、trace、guided review或prerequisite不完整。
    event: validation.evidence_captured
    handling: 保存可用證據並回報BLOCKED與remediation。
adr_exceptions: []

flows:
- id: governed-engineering-route
  owner: guided_workflow_router
  description: Automatically classify every software-engineering request, inspect
    its project state, preserve risk gates, and select an immediate safe handoff.
  trigger:
    kind: command
    ref: guided-routing.route
    description: The user states a software-engineering intent; no ask-matt invocation
      is required.
  steps:
  - id: governed-engineering-route.assess
    order: 1
    module: workflow_routing_domain
    action: Classify ordered hard intent and assess implementation and durable context
      from repository evidence.
    receives:
    - workflow-routing.assess-project
    - repository-evidence.collect
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-engineering-route.classify-risk
    order: 2
    module: risk_routing_domain
    action: Match ordered risk hard triggers and preserve the required governance gates.
    receives:
    - risk-routing.classify
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-engineering-route.select
    order: 3
    module: workflow_routing_domain
    action: Apply explicit-skill, intent, project-state, confirmed-spec resume
      evidence, risk-gate, capability, and wayfinder precedence to produce the
      authoritative GuidedRouteDecision.
    receives:
    - workflow-routing.select
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: A PASS or DEGRADED decision selects an immediate safe handoff; unresolved
      evidence or missing non-substitutable capability returns BLOCKED.
    events: []
  errors: []
- id: governed-change-set-lifecycle
  owner: delivery_workflow_domain
  description: Reconcile one modifying change set into a canonical specification,
    review material Flow costs and evidence, materialize it after authorization,
    verify traceability, implement it, and close it only after Spec review passes.
  trigger:
    kind: command
    ref: spec-governance.reconcile
    description: A modifying engineering discussion confirms one new statement.
  steps:
  - id: governed-change-set-lifecycle.reconcile
    order: 1
    module: spec_governance_domain
    action: Classify the confirmed statement, update stable relationships, and report
      the working specification delta, conflicts, and open decisions.
    receives:
    - spec-governance.reconcile
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.review-flow-cost
    order: 2
    module: governance_workflow_domain
    action: Review every material as-is and target Flow through functional
      admission, execution and real-time feasibility, maintainability and
      extensibility change scenarios, and model assurance; keep unresolved
      load-bearing evidence BLOCKED.
    receives: []
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.authorize
    order: 3
    module: delivery_workflow_domain
    action: Present the decision-complete specification and wait for exact repository
      execution authorization without writing files.
    receives: []
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.materialize
    order: 4
    module: spec_governance_domain
    action: Materialize the authorized canonical specification under specs/ and
      preserve it if tracker publication later fails.
    receives:
    - spec-governance.materialize
    emits: []
    state_changes: []
    side_effects:
    - Write one canonical specification revision.
  - id: governed-change-set-lifecycle.publish
    order: 5
    module: delivery_workflow_domain
    action: Publish a tracker snapshot that names the repository specification as canonical.
    receives: []
    emits: []
    state_changes: []
    side_effects:
    - Create or update one tracker Issue when configured.
  - id: governed-change-set-lifecycle.verify
    order: 6
    module: spec_governance_domain
    action: Verify requirement-to-acceptance-to-validation traceability and return
      to grilling only when the request introduces a new decision or conflict.
    receives:
    - spec-governance.verify
    emits: []
    state_changes: []
    side_effects: []
  - id: governed-change-set-lifecycle.implement-review
    order: 7
    module: delivery_workflow_domain
    action: Implement through the agreed test seams, run two-axis review, and mark
      the canonical specification implemented only after the Spec axis passes.
    receives: []
    emits: []
    state_changes: []
    side_effects:
    - Update the canonical specification with PASS evidence and implemented status.
  success:
    result: The implemented behavior is traceable to one canonical specification
      whose requirements and acceptance criteria have verified PASS evidence.
    events: []
  errors:
  - condition: Reconciliation finds an unresolved conflict or conclusion-changing decision.
    event: spec-governance.blocked
    handling: Remain in grilling and ask exactly one conclusion-changing question.
  - condition: A material Flow has unresolved platform units, cost paths, budgets,
      model error, reserve, interference, or scenario coverage.
    event: spec-governance.blocked
    handling: Preserve directional analysis but keep the performance or real-time
      claim BLOCKED until the required evidence is calibrated.
  - condition: Canonical materialization succeeds but tracker publication fails.
    event: delivery.tracker-publication-pending
    handling: Preserve the canonical specification and report BLOCKED with a retry target.

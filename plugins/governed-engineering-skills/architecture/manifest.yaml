type_exclusions: []
state_objects: []
boundary_mappings: []
flows:
- id: governed-engineering-route
  owner: guided_workflow_router
  description: Classify an engineering request before selecting its first workflow
    step.
  trigger:
    kind: command
    ref: risk-routing.classify
    description: The user asks ask-matt or enters a governed engineering skill.
  steps:
  - id: governed-engineering-route.classify
    order: 1
    module: risk_routing_domain
    action: Match ordered hard triggers and produce a RoutingDecision.
    receives:
    - risk-routing.classify
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: A PASS decision selects the next skill or identifies an out-of-scope standalone
      request.
    events: []
  errors: []
adr_exceptions: []
c_analyzer:
  ast:
    status: not-applicable
    rationale: The governed integration contains prompts, JSON contracts, and Python
      tooling but no production C or C++ translation units.
  functional_boundary:
    status: not-applicable
    rationale: The plugin has no C or C++ framework boundary.
    forbidden_includes: []
    forbidden_symbols: []
  forbidden_public_includes: []
  forbidden_public_symbols: []
  forbidden_source_symbols: []
python_analyzer:
  status: required
  rationale: Production routing and integration tooling is implemented in Python and requires AST evidence.
workloads:
- id: governed-routing-workload
  flow: governed-engineering-route
  steps:
  - governed-engineering-route.classify
  timing_class: best-effort
  activation:
    kind: command
  data:
    volume: one engineering task
  budgets: []

composition_roots:
- id: guided-workflow-release
  module: guided_workflow_router
  path: skills/ask-matt/SKILL.md
  symbol: ask-matt
  purpose: Compose the installed plugin's governed engineering workflow entry.
  source_set: plugin-production
  kind: release
ports:
- id: guided-routing.route
  owner: guided_workflow_router
  direction: input
  kind: query
  contract: skills/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Route one software-engineering request to its safe primary skill.
    data: Task text, project root, explicit skill, available capabilities, risk decision,
      and wayfinder complexity evidence.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: The task text or project root is malformed.
    - code: unavailable
      condition: Project-state evidence cannot be collected.
  symbols:
  - ask-matt
- id: risk-routing.classify
  owner: risk_routing_domain
  direction: input
  kind: query
  contract: skills/engineering-risk-routing/references/routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Classify one engineering task and select required gates.
    data: Task text, optional entry skill, available capabilities, and passed gate
      evidence.
    timing: sync
    immediate_rejections: []
  symbols:
  - classify
- id: workflow-routing.assess-project
  owner: workflow_routing_domain
  direction: input
  kind: query
  contract: skills/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Convert repository evidence into a three-state implementation and documentation assessment.
    data: Read-only tracked and non-ignored untracked path evidence.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: Evidence does not satisfy the RepositoryEvidence contract.
  symbols:
  - assess_project_state
- id: workflow-routing.select
  owner: workflow_routing_domain
  direction: input
  kind: query
  contract: skills/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by: []
  description:
    purpose: Select the authoritative skill handoff after intent, project state, risk,
      capability, and complexity checks.
    data: IntentAssessment, ProjectStateAssessment, RoutingDecision, capabilities,
      and wayfinder threshold evidence.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: Any required assessment is missing or malformed.
  symbols:
  - select_workflow
- id: repository-evidence.collect
  owner: workflow_routing_domain
  direction: output
  kind: query
  contract: skills/engineering-risk-routing/references/guided-routing-contract.schema.json
  implemented_by:
  - repository_evidence_adapter
  description:
    purpose: Read repository paths and Git tracking status for project-state assessment.
    data: One project root produces normalized RepositoryEvidence rows.
    timing: sync
    immediate_rejections:
    - code: unavailable
      condition: The root is unreadable or Git evidence collection fails.
  symbols:
  - RepositoryEvidencePort
- id: spec-governance.reconcile
  owner: spec_governance_domain
  direction: input
  kind: query
  contract: skills/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Reconcile one newly confirmed discussion statement into the working specification.
    data: Existing durable context, the working specification, and one confirmed statement
      produce a classified delta and consistency verdict.
    timing: sync
    immediate_rejections:
    - code: invalid
      condition: The statement or working specification is malformed.
  symbols:
  - spec-governance
- id: spec-governance.materialize
  owner: spec_governance_domain
  direction: input
  kind: command
  contract: skills/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Persist one decision-complete working specification as the canonical repository artifact.
    data: An authorized PASS SpecConsistencyAssessment produces one versioned Markdown specification.
    timing: sync
    immediate_rejections:
    - code: unauthorized
      condition: The user has not supplied the repository's exact execution authorization.
    - code: unresolved
      condition: Conflicts, open decisions, invalid relations, or uncovered requirements remain.
  symbols:
  - spec-governance
- id: spec-governance.verify
  owner: spec_governance_domain
  direction: input
  kind: query
  contract: skills/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Verify a canonical specification and its requirement-to-validation traceability.
    data: A resolved canonical specification and current request produce a PASS or BLOCKED assessment.
    timing: sync
    immediate_rejections:
    - code: ambiguous
      condition: More than one canonical specification matches the current change set.
    - code: invalid
      condition: The selected specification violates the structural contract.
  symbols:
  - spec-governance
- id: spec-governance.result
  owner: spec_governance_domain
  direction: output
  kind: event
  contract: skills/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Publish one specification lifecycle result to the delivery parent.
    data: Consistency or traceability verdict with canonical specification identity.
    timing: sync
    immediate_rejections: []
  symbols:
  - spec-governance
- id: delivery-workflow.result
  owner: delivery_workflow_domain
  direction: output
  kind: event
  contract: skills/spec-governance/references/spec-contract.schema.json
  implemented_by: []
  description:
    purpose: Publish delivery failures that preserve a valid canonical specification.
    data: Canonical specification identity and the pending external delivery action.
    timing: sync
    immediate_rejections: []
  symbols:
  - implement
- id: libclang_toolchain.resolve
  owner: governance_workflow_domain
  direction: output
  kind: query
  contract: skills/govern-modular-event-architecture/scripts/libclang_toolchain_contract.py
  implemented_by:
  - libclang_toolchain_adapter
  description:
    purpose: Resolve, bind, and verify one lock-pinned target-capable libclang provider.
    data: Toolchain lock and operation mode produce immutable provider evidence
      or fail-closed CAST diagnostics.
    timing: sync
    immediate_rejections:
    - code: CAST001
      condition: Provider or Xtensa capability is unavailable.
    - code: CAST002
      condition: Lock, platform, cache, or receipt is invalid.
  symbols:
  - LibclangToolchainPort
events:
- id: spec-governance.blocked
  owner: spec_governance_domain
  output_port: spec-governance.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Tell delivery orchestration that specification work cannot continue safely.
    emitted_when: A reconciliation or verification has unresolved blocking evidence.
    payload_fields:
    - name: verdict
      type: string
      meaning: BLOCKED specification verdict.
    - name: reason
      type: string
      meaning: Conflict, ambiguity, or missing traceability that must be resolved.
    intended_consumers:
    - delivery_workflow_domain
- id: delivery.tracker-publication-pending
  owner: delivery_workflow_domain
  output_port: delivery-workflow.result
  delivery: at-most-once
  envelope: [event_type, source, correlation_id, stream_id, sequence, payload]
  lifecycle: [received, validated, processing, succeeded, failed]
  description:
    purpose: Preserve durable context while reporting that its tracker snapshot remains pending.
    emitted_when: Canonical materialization succeeds and tracker publication fails.
    payload_fields:
    - name: canonical_spec
      type: CanonicalSpecReference
      meaning: The repository specification that remains authoritative and retryable.
    intended_consumers:
    - guided_workflow_router

execution_units: []
execution_mappings: []
execution_channels: []
data_access_profiles: []
microarchitecture_profiles: []
platform_variants: []
realtime_scheduling_studies: []
validation_profiles:
- id: plugin-host-validation
  applicability: not-applicable
  rationale: Plugin integration validation makes no hardware, target-runtime, performance, or real-time acceptance claim.

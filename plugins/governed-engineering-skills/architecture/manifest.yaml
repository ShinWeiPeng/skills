standard_version: 2.1.0
schema_version: 2.1.0
project:
  name: Governed Engineering Skills
  documentation_language: en
source_sets:
- id: plugin-production
  classification: production
  include:
  - skills/**
  - scripts
  - scripts/**
  - .codex-plugin
  - .codex-plugin/**
  - vendor-lock.json
  exclude:
  - skills/**/tests/**
  - skills/**/tools/**
  - skills/**/architecture/generated/**
  - skills/**/__pycache__/**
  purpose: Govern the installed skill prompts, routing contracts, classifier, plugin
    manifest, and vendor synchronization.
  provenance: Human-maintained integration and pinned vendored snapshots.
- id: generated-tool-mirrors
  classification: generated-production
  include:
  - skills/**/tools/**
  exclude: []
  purpose: Distribute project-local mirrors generated from canonical skill tooling.
  provenance: Bootstrap-owned copies of canonical skill scripts.
  generator: governed bootstrap tool mirror
  owner: integration_validation_technical
- id: plugin-development
  classification: development
  include:
  - tests/**
  - tools/**
  - skills/**/tests/**
  exclude: []
  purpose: Keep validation fixtures and development tooling outside formal product
    sources.
  provenance: Integration and vendored skill test tooling.
- id: plugin-derived-docs
  classification: derived-documentation
  include:
  - architecture/generated/**
  - skills/**/architecture/generated/**
  exclude: []
  purpose: Keep deterministic architecture views outside formal product sources.
  provenance: Architecture renderers.
- id: plugin-build-output
  classification: build-output
  include:
  - build/**
  - .cache/**
  - '**/__pycache__/**'
  exclude: []
  purpose: Exclude generated runtime and validation caches.
  provenance: Python and local build tools.
modules:
- id: guided_workflow_router
  level: L0
  role: composition
  implementation_status: implemented
  paths:
  - skills/ask-matt
  - skills/engineering-risk-routing/scripts/guided_workflow_router.py
  parent: null
  depends_on:
  - workflow_routing_domain
  - risk_routing_domain
  - delivery_workflow_domain
  - governance_workflow_domain
  - repository_evidence_adapter
  implements_ports: []
  public_headers: []
  description:
    purpose: Automatically route every software-engineering intent by coordinating
      workflow selection, repository state, risk, delivery, and governance domains.
    input_ports:
    - guided-routing.route
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Users never need to know or invoke ask-matt for software-engineering work.
    - Every design or specification decision offers two or three meaningful options,
      preferring structured choices and falling back to equivalent numbered text.
    - Every repository-modifying change set completes grilling before mutation.
    - Discoverable facts are explored before any unresolved decision is asked.
    - A newly discovered discretionary decision stops execution and returns to grilling.
    - A confirmed specification resumes only when the caller supplies explicit
      resume evidence; discovery alone proves only durable context.
    - Never route standalone learning-note or HackMD work.
  entrypoints:
  - path: skills/ask-matt/SKILL.md
    symbol: ask-matt
    kind: skill
  - path: skills/engineering-risk-routing/scripts/guided_workflow_router.py
    symbol: main
    kind: cli
  public_symbols:
  - path: skills/ask-matt/SKILL.md
    symbol: ask-matt
    kind: skill
  - path: skills/engineering-risk-routing/scripts/guided_workflow_router.py
    symbol: route
    kind: function
- id: risk_routing_domain
  level: L1
  role: domain
  implementation_status: implemented
  paths:
  - skills/engineering-risk-routing
  parent: guided_workflow_router
  depends_on: []
  implements_ports: []
  public_headers: []
  description:
    purpose: Own engineering risk classes, gate selection, fail-closed behavior, and
      resume targets.
    input_ports:
    - risk-routing.classify
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Higher hard-trigger risk always takes precedence.
    - Missing required capabilities or evidence cannot be downgraded.
  entrypoints:
  - path: skills/engineering-risk-routing/scripts/classify_risk.py
    symbol: main
    kind: cli
  public_symbols:
  - path: skills/engineering-risk-routing/scripts/classify_risk.py
    symbol: classify
    kind: function
- id: workflow_routing_domain
  level: L1
  role: domain
  implementation_status: implemented
  paths:
  - skills/engineering-risk-routing/scripts/project_state.py
  - skills/engineering-risk-routing/scripts/workflow_selection.py
  - skills/engineering-risk-routing/references/guided-routing-contract.schema.json
  - skills/engineering-risk-routing/references/intent-rules.json
  parent: guided_workflow_router
  depends_on: []
  implements_ports: []
  public_headers: []
  description:
    purpose: Own deterministic engineering-intent classification, three-state project
      assessment, capability fallback, and final skill handoff selection.
    input_ports:
    - workflow-routing.assess-project
    - workflow-routing.select
    output_ports:
    - repository-evidence.collect
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Explicit skills outrank inferred intent.
    - Intent selects the primary flow before project state and risk gates are applied.
    - A uniquely resolved confirmed specification does not bypass ProjectState
      interview precedence without explicit resume evidence.
    - Resume evidence fails closed unless it identifies one valid confirmed specification.
    - Indeterminate intent or project state is never silently guessed.
    - Risk classification adds gates but never replaces the primary user intent.
  entrypoints:
  - path: skills/engineering-risk-routing/scripts/project_state.py
    symbol: assess_project_state
    kind: function
  - path: skills/engineering-risk-routing/scripts/workflow_selection.py
    symbol: select_workflow
    kind: function
  public_symbols:
  - path: skills/engineering-risk-routing/scripts/project_state.py
    symbol: RepositoryEvidencePort
    kind: class
  - path: skills/engineering-risk-routing/scripts/project_state.py
    symbol: assess_project_state
    kind: function
  - path: skills/engineering-risk-routing/scripts/workflow_selection.py
    symbol: classify_intent
    kind: function
  - path: skills/engineering-risk-routing/scripts/workflow_selection.py
    symbol: select_workflow
    kind: function
- id: delivery_workflow_domain
  level: L1
  role: domain
  implementation_status: implemented
  paths:
  - skills/diagnosing-bugs
  - skills/grill-with-docs
  - skills/triage
  - skills/improve-codebase-architecture
  - skills/setup-matt-pocock-skills
  - skills/tdd
  - skills/to-spec
  - skills/to-tickets
  - skills/wayfinder
  - skills/implement
  - skills/prototype
  - skills/research
  - skills/domain-modeling
  - skills/codebase-design
  - skills/code-review
  - skills/resolving-merge-conflicts
  - skills/grill-me
  - skills/grilling
  - skills/handoff
  - skills/teach
  - skills/writing-great-skills
  parent: guided_workflow_router
  depends_on:
  - spec_governance_domain
  implements_ports: []
  public_headers: []
  description:
    purpose: Move an engineering idea or defect through planning, implementation,
      and review without bypassing required gates.
    input_ports: []
    output_ports:
    - delivery-workflow.result
    emitted_events:
    - delivery.tracker-publication-pending
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Mutation and commits require task and repository authorization.
    - Every repository-modifying change set has one canonical specification before implementation.
    - A confirmed specification is verified rather than re-interviewed only with
      explicit resume evidence and no new decision or conflict.
  entrypoints:
  - path: skills/implement/SKILL.md
    symbol: implement
    kind: skill
  - path: skills/implement/scripts/spec_delivery.py
    symbol: assess_delivery_spec_context
    kind: function
  public_symbols:
  - path: skills/implement/SKILL.md
    symbol: implement
    kind: skill
  - path: skills/implement/scripts/spec_delivery.py
    symbol: assess_delivery_spec_context
    kind: function
- id: spec_governance_domain
  level: L2
  role: component
  implementation_status: implemented
  paths:
  - skills/spec-governance
  parent: delivery_workflow_domain
  depends_on: []
  implements_ports: []
  public_headers: []
  description:
    purpose: Reconcile engineering discussion into one canonical change-set specification,
      materialize it only after authorization, and verify traceability before implementation.
    input_ports:
    - spec-governance.reconcile
    - spec-governance.materialize
    - spec-governance.verify
    output_ports:
    - spec-governance.result
    emitted_events:
    - spec-governance.blocked
    owned_state: []
    side_effects:
    - description: Materialize one authorized canonical specification under specs/.
    errors:
    - id: specification_unresolved
      condition: Conflicts, open decisions, invalid references, or missing requirement-to-acceptance
        traceability remain.
      event: spec-governance.blocked
      handling: Preserve the last confirmed specification and return to grilling with
        exactly one conclusion-changing question.
    invariants:
    - Discussion updates remain an in-conversation working specification until explicit authorization.
    - Confirmed specifications have unique stable IDs, resolved relations, no open decisions,
        and at least one acceptance criterion per requirement.
    - Implemented specifications record PASS evidence for every acceptance criterion
        and a passing Spec review.
  entrypoints:
  - path: skills/spec-governance/SKILL.md
    symbol: spec-governance
    kind: skill
  - path: skills/spec-governance/scripts/spec_contract.py
    symbol: main
    kind: cli
  public_symbols:
  - path: skills/spec-governance/SKILL.md
    symbol: spec-governance
    kind: skill
  - path: skills/spec-governance/scripts/spec_contract.py
    symbol: main
    kind: function
- id: governance_workflow_domain
  level: L1
  role: domain
  implementation_status: implemented
  paths:
  - skills/clarify-improvement-proposals
  - skills/explain-code-flow
  - skills/govern-modular-event-architecture
  - skills/validate-on-device
  parent: guided_workflow_router
  depends_on: []
  implements_ports: []
  public_headers: []
  description:
    purpose: Enforce decision completeness, evidence-calibrated Flow cost review,
      architecture ownership, evidence-backed explanation, and bounded runtime
      validation.
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Codex never approves its own ADR or Algorithm Design Record.
    - A material Flow recommendation evaluates functional admission, execution
      and real-time feasibility, maintainability and extensibility, and model
      assurance before Module, Port, Event, or execution decisions are finalized.
    - Estimated models cannot establish a platform performance winner or
      real-time PASS; load-bearing evidence gaps remain BLOCKED.
    - C/C++ AST governance resolves native libclang only through its demand-owned
      pinned provider contract.
  entrypoints:
  - path: skills/govern-modular-event-architecture/SKILL.md
    symbol: govern-modular-event-architecture
    kind: skill
  public_symbols:
  - path: skills/govern-modular-event-architecture/SKILL.md
    symbol: govern-modular-event-architecture
    kind: skill
  - path: skills/govern-modular-event-architecture/scripts/libclang_toolchain_contract.py
    symbol: LibclangToolchainPort
    kind: class

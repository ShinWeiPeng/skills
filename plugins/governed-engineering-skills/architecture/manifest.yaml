  parent: null
  depends_on:
  - workflow_routing_domain
  implements_ports:
  - repository-evidence.collect
  public_headers: []
  description:
    purpose: Enumerate tracked and non-ignored untracked repository evidence without
      mutating Git, the index, or the worktree.
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects: []
    errors: []
    invariants:
    - Never write repository files, Git metadata, or ignore configuration.
    - Exclude ignored dependencies, caches, build outputs, generated artifacts, and
      Git metadata from project-state evidence.
    - Never follow symbolic links or read their target metadata.
    - Preserve safely enumerable excluded paths with deterministic exclusion reasons.
  entrypoints:
  - path: skills/engineering-risk-routing/scripts/repository_evidence.py
    symbol: GitFilesystemRepositoryEvidenceAdapter
    kind: class
  public_symbols:
  - path: skills/engineering-risk-routing/scripts/repository_evidence.py
    symbol: GitFilesystemRepositoryEvidenceAdapter
    kind: class
- id: local_install_adapter
  level: L3+
  role: adapter
  implementation_status: implemented
  paths:
  - scripts/install-local.ps1
  parent: null
  depends_on: []
  implements_ports: []
  public_headers: []
  description:
    purpose: Register the repo-local marketplace through the supported Codex CLI
      command and open the governed plugin's Codex Desktop installation page.
    input_ports: []
    output_ports: []
    emitted_events: []
    owned_state: []
    side_effects:
    - description: Register the repo-local marketplace in the current user's Codex
        configuration.
    - description: Open the governed plugin detail page in Codex Desktop for the
        user-confirmed Install action.
    errors: []
    invariants:
    - Resolve repository and plugin paths relative to the installer location.
    - Resolve Codex from PATH or the stable per-user Codex Desktop runtime directory.
    - Never prompt for paths, parameters, or confirmations.
    - Never assume that the Codex CLI supports plugin add or plugin list commands.
    - Never report that the plugin is installed before the user confirms Install in
      Codex Desktop.
    - Stop when marketplace registration or the Desktop install-page launch fails.
  entrypoints:
  - path: scripts/install-local.ps1
    symbol: install-local
    kind: script
  public_symbols:
  - path: scripts/install-local.ps1
    symbol: install-local
    kind: script
